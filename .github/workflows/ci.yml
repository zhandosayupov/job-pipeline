name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Leak guard
        run: uv run python tools/leak_guard.py --all
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q

офессионального и карьерного роста.&lt;/li&gt;\n\t&lt;li&gt;Минимум бюрократии и отсутствие строгого дресс-кода.&lt;/li&gt;\n\t&lt;li&gt;Комфортный офис в центре Алматы (ул. Абая, 26А/Наурызбай батыра 154).&lt;/li&gt;\n\t&lt;li&gt;Уютная chill-зона, внутренний дворик и workout-площадка.&lt;/li&gt;\n\t&lt;li&gt;Бесплатный тренажерный зал прямо в офисе.&lt;/li&gt;\n\t&lt;li&gt;Доступ к электронной библиотеке.&lt;/li&gt;\n\t&lt;li&gt;Обучение, профессиональные курсы и тренинги за счет компании.&lt;/li&gt;\n\t&lt;li&gt;Ежегодный бонус.&lt;/li&gt;\n&lt;/ul&gt;\n&lt;/p&gt;","identifier":{"@type":"PropertyValue","name":"Kaspi.kz"},"datePosted":"2026-11-12 11:03:42.122208","validThrough":"","employmentType":" Array ","hiringOrganization":{"@type":"Organization","name":"Kaspi.kz"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"KZ","addressRegion":"Kaspi.kz","addressCountry":"KZ"}}}</script></head><body>vacancy</body></html>

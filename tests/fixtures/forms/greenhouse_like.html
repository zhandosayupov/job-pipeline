<!-- Synthetic form shaped like a hosted Greenhouse application (labels with for=, required markers). -->
<html><body>
<form id="application_form">
  <div><label for="first_name">First Name *</label><input type="text" id="first_name" name="job_application[first_name]" required></div>
  <div><label for="last_name">Last Name *</label><input type="text" id="last_name" name="job_application[last_name]" required></div>
  <div><label for="email">Email *</label><input type="email" id="email" name="job_application[email]" aria-required="true"></div>
  <div><label for="phone">Phone</label><input type="tel" id="phone" name="job_application[phone]"></div>
  <div><label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume" required></div>
  <div><label for="cover_letter_text">Cover Letter</label><textarea id="cover_letter_text" name="cover_letter"></textarea></div>
  <div><label for="q_auth">Are you legally authorized to work in the Netherlands? *</label>
    <select id="q_auth" name="answers[1]" required><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div><label for="q_spons">Will you now or in the future require sponsorship for employment visa status? *</label>
    <select id="q_spons" name="answers[2]" required><option value="">Please select</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div><label for="q_notice">What is your notice period? *</label><input type="text" id="q_notice" name="answers[3]" required></div>
  <fieldset><legend>Relocation</legend>
    <label><input type="radio" name="relocation" value="y"> Yes</label>
    <label><input type="radio" name="relocation" value="n"> No</label></fieldset>
  <div><label for="q_hear">How did you hear about us?</label><input type="text" id="q_hear" name="answers[4]"></div>
  <input type="hidden" name="token" value="abc">
  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body></html>

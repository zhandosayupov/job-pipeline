# Copied to $JOBPIPE_HOME/config/settings.yaml by `jobpipe init`. Edit the copy, not this file.

timezone: Asia/Almaty

telegram:
  # Your numeric Telegram user id. The bot ignores everyone else.
  # Find it by messaging @userinfobot, or from the bot's log after you message it once.
  owner_id: null
  token_env: TELEGRAM_BOT_TOKEN   # name of the variable in secrets.env

queue:
  lease_seconds: 600        # must exceed runner.hard_timeout_s
  max_reclaims: 3           # a task that kills its runner this many times is dead-lettered
  default:
    max_attempts: 5
    backoff_base_s: 30
    backoff_cap_s: 3600
  types:
    selftest.fail:          # fast schedule so the S0 demo finishes in minutes
      max_attempts: 4
      backoff_base_s: 5
      backoff_cap_s: 60

runner:
  max_seconds: 240          # a queue run stops taking tasks after this
  hard_timeout_s: 300       # = TimeoutStartSec in ops/systemd/jobpipe-queue.service
  kill_grace_s: 8           # /pause: SIGTERM, then SIGKILL after this many seconds

backup:
  keep: 7
  # upload_cmd: ["/opt/jobpipe/ops/upload-backup.sh", "{path}"]

retention:                  # ADR 0018: daily at 04:00; `jobpipe run retention --dry-run` to preview
  tasks_done_days: 7
  tasks_dead_days: 30
  runs_days: 14
  llm_calls_days: 35        # rolled up into llm_daily first
  events_days: 60           # application/conversation events are kept (funnel history)
  jobs_compact_days: 30     # finished jobs keep only keep_fields + resolution
  applications_compact_days: 180
  side_effects_compact_days: 90
  messages_compact_days: 120   # mail text dropped, headers + category kept
  keep_fields:
    job: [company, title, url, fingerprint, source]
    application: [company, title, url, platform]

label:                      # S2 (spec §7)
  batch_size: 20
  max_jobs_per_run: 200
  daily_max_jobs: 600         # budget guard: labeling stops for the day after this many
  shortlist_threshold: 60     # score >= this and action != skip -> shortlisted
  alert_threshold: 80         # instant Telegram card with buttons
  # Who the labels are for. Personal details belong only in your private copy of this file.
  profile: "Software engineer, about 3 years of C++ and backend experience. Prefers low-latency, trading, search, infrastructure and distributed-systems roles."

http:
  host: 127.0.0.1
  port: 8080

log_level: INFO

inbox:                      # S5 (ADR 0023): Gmail over IMAP with an app password (GMAIL_APP_PASSWORD)
  gmail_user: null          # the mailbox to read; null = the email in kb/profile.yaml
  first_run_days: 14        # the first run reads this far back, never the whole mailbox
  max_per_run: 200
  ghosted_after_days: 21    # applied, no reply this long -> ghosted
  # Only job-related mail is read further: replies in tracked threads, these senders, or job words.
  alert_senders: [hh.kz, hh.ru, jobalerts-noreply@linkedin.com]
  ignore_senders: []        # never read, e.g. a newsletter that mentions jobs

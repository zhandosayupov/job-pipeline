# Company boards on hosted ATSes. Copied to $JOBPIPE_HOME/config/companies.yaml by `jobpipe init`.
# Each entry is one request per collect run. Tokens checked against the live APIs on 2026-11-26.
# priority: 1 = target firm, 2 = good fit, 3 = broad net. Protected companies (no automatic
# applications) are listed separately in protected.yaml (S2); collecting them is fine.
#
# Find a token: the board URL boards.greenhouse.io/<token>, jobs.ashbyhq.com/<token>,
# jobs.lever.co/<token>. Check it: curl -s https://boards-api.greenhouse.io/v1/boards/<token>/jobs | head -c 200


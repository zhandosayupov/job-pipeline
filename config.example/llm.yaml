# LLM router config (ADR 0004). Copied to $JOBPIPE_HOME/config/llm.yaml by `jobpipe init`.
#
# Limits are YOURS to fill from each provider's current free-tier page; the router never guesses.
# The numbers below are deliberately conservative placeholders. Model ids change: check them in
# the provider console before enabling.

pii_redaction: required              # required | off  (ADR 0008)
personal_on_training_providers: false
breaker_threshold: 3                 # consecutive failures before a provider is switched off
breaker_minutes: 15
default_cooldown_s: 60               # after a 429 without retry-after
retry_backoff_s: 2

# Personal values replaced by {{LABEL}} before personal prompts leave the machine.
# Keep real values only in your private copy of this file.
pii_values: {}
#  NAME: ["Full Name", "Name Surname"]
#  EMAIL: ["me@example.com"]
#  PHONE: ["+7 700 000 00 00"]

providers:
  # A provider lists its models in the order to try them. Quotas, 429 cooldowns and the breaker
  # are per model (free tiers limit each model separately). A task chain entry is either
  # "provider" (all its models) or "provider/model-id" (just one).
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_env: GEMINI_API_KEY
    timeout_s: 30
    day_reset_tz: America/Los_Angeles
    trains_on_data: true             # free tier: assume prompts may be used for training
    # Tested on the free tier on 2026-11-26 ("say pong"; list yours with GET .../openai/models):
    #   200 in <1 s: gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-flash-lite-latest
    #   503 "high demand": gemini-3.8-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-flash-latest
    #   timeout at 60 s: gemini-3.7-flash · 404 (retired): gemini-2.5-flash, gemini-2.5-flash-lite
    # gemini-flash-lite-latest first; the other lite models catch a 503 on it; the bigger ones are
    # a reserve with a short timeout. A 503 is that model being overloaded, so another model helps.
    # One quota for the whole key (as AI Studio showed it): counted across all models below.
    # Limits are conservative placeholders: copy the real ones from your AI Studio rate-limit page.
    quota_scope: provider
    rpm: 10
    rpd: 500
    models:
      - id: gemini-flash-lite-latest
      - id: gemini-3.5-flash-lite
      - id: gemini-3.1-flash-lite
      - id: gemini-3.8-flash
        timeout_s: 20
      - id: gemini-3.5-flash
        timeout_s: 20
      - id: gemini-flash-latest
        timeout_s: 20
  groq:
    enabled: false
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile   # verify in the Groq console
    key_env: GROQ_API_KEY
    rpm: 10
    rpd: 500
    trains_on_data: false            # verify in Groq's terms
  cerebras:
    enabled: false
    base_url: https://api.cerebras.ai/v1
    model: llama-3.3-70b             # verify in the Cerebras console
    key_env: CEREBRAS_API_KEY
    rpm: 10
    rpd: 500
    trains_on_data: false            # verify in Cerebras' terms
  openrouter:
    enabled: false
    base_url: https://openrouter.ai/api/v1
    model: "meta-llama/llama-3.3-70b-instruct:free"   # verify on openrouter.ai
    key_env: OPENROUTER_API_KEY
    rpm: 10
    rpd: 50
    trains_on_data: true             # free endpoints may log prompts

tasks:
  ping:
    chain: [gemini, groq, cerebras, openrouter]
    prompt_version: v1
    temperature: 0
    max_tokens: 64
  label:                             # S2: batches of 20 jobs, JSON out, checked before use
    chain: [gemini]
    prompt_version: v1
    temperature: 0
    max_tokens: 8000
  tailor:                            # S3: picks facts for the CV (pseudonymized), checked before use
    chain: [gemini]
    prompt_version: v1
    temperature: 0
    max_tokens: 4000
  cover_letter:                      # S3: short letter from the chosen facts, then the truth gate
    chain: [gemini]
    prompt_version: v1
    temperature: 0.3
    max_tokens: 1200
  triage:                            # S5: one recruiter message -> category, questions, topics (pseudonymized)
    chain: [gemini]
    prompt_version: v1
    temperature: 0
    max_tokens: 800
  reply:                             # S5: reply draft around fixed answers and placeholders, then the truth gate
    chain: [gemini]
    prompt_version: v1
    temperature: 0.3
    max_tokens: 1200
  kb_extract:                        # S7: CV -> draft facts for review (pseudonymized), checked against the CV
    chain: [gemini]
    prompt_version: v1
    temperature: 0
    max_tokens: 8000

    question_patterns: ['willing to relocate', 'open to relocation', 'relocat']
    answer: Yes, I am open to relocation.
    answer_ru: Да, готов к переезду.
  - topic: english
    question_patterns: ['english level', 'english proficiency']
    answer: C1, working proficiency.

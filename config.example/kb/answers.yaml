# EXAMPLE answers to recurring form questions, used verbatim (ADR 0016). Salary is not here on
# purpose: policy.yaml sends compensation questions to the owner.
answers:
  - topic: notice_period
    question_patterns: ['notice period', 'when can you start', 'start date', 'availability']
    answer: Two weeks after signing the offer.
    answer_ru: Через две недели после подписания оффера.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jobpipe"
version = "0.1.0"
description = "Self-hosted job search pipeline: collect, label, tailor, apply, track. Controlled from Telegram, every outbound action approved by a human."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "tzdata>=2024.1; sys_platform == 'win32'",  # Windows has no system time zone database
]

[project.scripts]
jobpipe = "jobpipe.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
# The laptop browser worker only (S4): uv sync --group worker && uv run playwright install chromium
worker = [
  "playwright>=1.48",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits real endpoints; excluded by default (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intentional
